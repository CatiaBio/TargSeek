# TargSeek conda environment
# ------------------------------------------------------
# Create:   conda env create -f env.yml
# Activate: conda activate targseek
#
# Versions tested together in Nov 2026 (Snakemake 9, pandas 3, NumPy 2).
# The exact environment used for the 2025 results is in
# env/targseek_2025_frozen.yml (Snakemake 7.32, pandas 2.3, NumPy 1.26).
# ------------------------------------------------------

name: targseek

channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.12
  - snakemake=9.24

  # Bioinformatics tools
  - mafft=7.526              # Multiple sequence alignment
  - clipkit=2.14             # MSA trimming
  - blast=2.17               # Epitope cross-reactivity (blastp, makeblastdb)
  - pymol-open-source=3.1    # Epitope structure images

  # Python packages
  - biopython=1.88
  - pandas=3.1
  - numpy=2.5
  - scipy=1.18
  - matplotlib=3.11
  - seaborn=0.13
  - requests=2.34
  - pyyaml=6.0
  - tqdm=4.70
  - pip

  - pip:
      - logomaker==0.8.7     # Sequence logos
      - bacdive==2.0.0       # BacDive API client (Gram classification)

# Installed separately (not available via conda):
# - ConSurf standalone (+ rate4site)
# - BepiPred 3.0 (own environment; PyTorch + ESM-2)
# - DeepTMHMM (via biolib)
#
# APIs: NCBI E-utilities (email, API key recommended), BacDive (account),
#       UniProt, QuickGO, RCSB PDB (no registration).
